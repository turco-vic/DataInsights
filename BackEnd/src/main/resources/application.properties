spring.application.name=cti-provedor

spring.datasource.url=jdbc:postgresql://eturcodev.postgres.database.azure.com:5432/postgres?sslmode=require
spring.datasource.username=eturcodevadmin
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt.secret=${JWT_SECRET:troque-esta-chave-por-um-segredo-bem-grande-e-unico}
app.jwt.expiration-ms=3600000
