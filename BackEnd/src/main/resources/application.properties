spring.application.name=cti-provedor

spring.datasource.url=jdbc:postgresql://eturcodev.postgres.database.azure.com:5432/postgres?sslmode=require
spring.datasource.username=eturcodevadmin
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt.secret=${JWT_SECRET:troque-esta-chave-por-um-segredo-bem-grande-e-unico}
# Sessão normal: 1 hora. "Manter conectado": 7 dias.
app.jwt.expiration-ms=3600000
app.jwt.expiration-longa-ms=${JWT_EXPIRATION_LONGA_MS:604800000}

# Endereço do front-end, usado nos links enviados por e-mail.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Cadastro público (tela "Criar acesso"). O primeiro usuário vira administrador;
# os seguintes recebem o papel abaixo e podem ser promovidos na tela de Usuários.
app.cadastro.aberto=${CADASTRO_ABERTO:true}
app.cadastro.papel-padrao=${CADASTRO_PAPEL_PADRAO:LEITOR}

# E-mail (recuperação de senha e resumo semanal). Sem SPRING_MAIL_HOST definido,
# nada é enviado e o link de recuperação aparece no log do servidor.
app.mail.remetente=${MAIL_FROM:nao-responda@datainsights.local}
