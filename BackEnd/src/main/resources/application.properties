spring.application.name=cti-provedor

# Passo 3 - Conexao com o Azure PostgreSQL
# Troque <servidor>, <banco>, <usuario> e <senha> pelos dados do seu recurso no Azure.
spring.datasource.url=jdbc:postgresql://<servidor>.postgres.database.azure.com:5432/<banco>?sslmode=require
spring.datasource.username=<usuario>
spring.datasource.password=<senha>

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Passo 5 - Configuracao do token JWT
# Troque por uma chave secreta grande antes de ir para producao.
app.jwt.secret=troque-esta-chave-por-um-segredo-bem-grande-e-unico
app.jwt.expiration-ms=3600000
